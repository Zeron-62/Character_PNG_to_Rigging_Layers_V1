name: Phase 1 memory-manager checks

on:
  push:
    branches:
      - feature/phase-1-memory-manager
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python source
        run: python -m compileall -q app scripts tests
      - name: Run memory-manager unit tests
        run: python -m unittest tests.test_memory_manager -v
